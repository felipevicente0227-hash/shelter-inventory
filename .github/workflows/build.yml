# Builds the downloadable app on GitHub's own computers, so you never need a
# Mac to make the Mac version or a clean Windows PC to make the Windows one.
#
# Two ways it runs:
#   * every push and pull request  -> tests only (fast, no download produced)
#   * pushing a tag like v0.2.0    -> tests, then build BOTH downloads and
#                                     attach them to a GitHub Release
#
# To ship a new version:  git tag v0.6.2 && git push --tags
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write        # needed to attach files to the Release

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python tests.py

  build-windows:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pyinstaller pywebview
      - run: python tests.py
      - run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name ShelterInventory --icon icon.ico --add-data "icon.ico;."
          --add-data "webui;webui" --hidden-import shelter_inventory_classic
          shelter_inventory.py
      - uses: actions/upload-artifact@v7
        with:
          name: ShelterInventory-windows
          path: dist/ShelterInventory.exe

  build-mac:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pyinstaller pywebview
      - run: python tests.py
      - run: >
          python -m PyInstaller --noconfirm --clean --windowed
          --name ShelterInventory --add-data "icon.ico:."
          --add-data "webui:webui" --hidden-import shelter_inventory_classic
          shelter_inventory.py
      - run: cd dist && zip -r ShelterInventory-mac.zip ShelterInventory.app
      - uses: actions/upload-artifact@v7
        with:
          name: ShelterInventory-mac
          path: dist/ShelterInventory-mac.zip

  release:
    needs: [build-windows, build-mac]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Release notes = this tag's section of CHANGELOG.md (from its
      # "## vX.Y.Z" heading up to the next "## "), then the how-to-install text.
      - name: Write release notes
        run: |
          awk -v tag="$GITHUB_REF_NAME" '/^## / { found = ($2 == tag) } found' CHANGELOG.md > notes.md
          if ! [ -s notes.md ]; then
            echo "CHANGELOG.md has no '## $GITHUB_REF_NAME' section - add one before tagging." >&2
            exit 1
          fi
          cat >> notes.md <<'EOF'

          **Windows:** download `ShelterInventory.exe` and double-click it.
          The first time, Windows may say "Windows protected your PC" —
          click **More info** → **Run anyway**. (The app is not code-signed,
          because signing certificates cost money and this tool is free.)

          **Mac:** download the zip, unzip, right-click `ShelterInventory` → **Open**.

          Your data is saved in `Documents/ShelterInventory/` on your computer.
          Nothing is uploaded anywhere.
          EOF
      - uses: actions/download-artifact@v8
        with:
          path: downloads
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            downloads/ShelterInventory-windows/ShelterInventory.exe
            downloads/ShelterInventory-mac/ShelterInventory-mac.zip
          body_path: notes.md
          fail_on_unmatched_files: true
